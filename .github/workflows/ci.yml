name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - name: data checkers (labels must still check out) and doc links
        run: |
          python bench/check_questions.py
          python bench/check_text_questions.py
          python bench/check_real_text_questions.py
          python bench/check_links.py
      - name: an installed copy ships its calibration
        # Run from outside the repository, so only what pip installed is found.
        # Before the calibration moved into the package, this printed
        # "no calibration ... running uncalibrated" and a different confidence.
        run: |
          python -m pip install --quiet .
          cd "$RUNNER_TEMP"
          eightball ask "is water wet?" --backend mock 2> err.txt
          test ! -s err.txt || { cat err.txt; exit 1; }
